name: Sync shop with eBay
# Keeps cards.json (the shop at shop.rod-tcg.com) matching the rodtcg ACTIVE eBay listings.
# Runs every hour and on demand (Actions tab > Sync shop with eBay > Run workflow).
# Needs repo secret EBAY_KEYS (the whole ebay_keys note), or EBAY_CLIENT_ID + EBAY_CLIENT_SECRET. Only cards.json is ever changed.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ebay-shop-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull active eBay listings into cards.json
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_KEYS: ${{ secrets.EBAY_KEYS }}
        run: |
          cat > /tmp/ebay_shop_sync.py <<'PY'
          """ROD TCG shop <- eBay sync (runs in GitHub Actions).
          Makes cards.json list exactly the seller's ACTIVE eBay listings.
          Keeps hand-curated fields (name, set, number, rarity, condition, grader, grade, back photo, dates)
          for cards already in cards.json; eBay owns price, link and front photo. Only cards.json is written."""
          import base64, json, os, re, sys, urllib.parse, urllib.request
          from datetime import datetime, timezone

          SELLER, CATEGORY, API = "rodtcg", "2536", "https://api.ebay.com"
          RARITIES = ["Special Illustration Rare", "Illustration Rare", "Mega Attack Rare", "Ultra Rare", "ACE SPEC Rare",
                      "Rare Holo V", "Promo", "Double Rare", "Holo Rare", "Rare", "Uncommon", "Common"]
          ALIASES = {"sir": "Special Illustration Rare", "ir": "Illustration Rare", "art rare": "Illustration Rare",
                     "secret rare": "Ultra Rare", "hyper rare": "Ultra Rare", "full art": "Ultra Rare", "rr": "Double Rare",
                     "holo": "Holo Rare", "rare holo": "Holo Rare", "holofoil": "Holo Rare", "ace spec rare": "ACE SPEC Rare",
                     "ace spec": "ACE SPEC Rare", "rare holo v": "Rare Holo V", "promo": "Promo",
                     "black star promo": "Promo", "mar": "Mega Attack Rare",
                     "classic collection": "Ultra Rare", "rare holo legend": "Ultra Rare", "legend": "Ultra Rare"}
          GRADERS = ["PSA", "BGS", "CGC", "SGC", "TAG", "ACE", "Beckett"]
          CURATED = ["name", "number", "set", "rarity", "condition", "grader", "grade", "backPhotoUrl", "listedAt", "listedDate"]


          def http(req, tries=3):
              for i in range(tries):
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          return json.loads(r.read().decode())
                  except Exception:
                      if i == tries - 1:
                          raise


          def token(cid, secret):
              auth = base64.b64encode(f"{cid}:{secret}".encode()).decode()
              body = urllib.parse.urlencode({"grant_type": "client_credentials",
                                             "scope": "https://api.ebay.com/oauth/api_scope"}).encode()
              return http(urllib.request.Request(f"{API}/identity/v1/oauth2/token", data=body, method="POST", headers={
                  "Authorization": f"Basic {auth}", "Content-Type": "application/x-www-form-urlencoded"}))["access_token"]


          def get(tok, path, params=None):
              url = f"{API}{path}" + ("?" + urllib.parse.urlencode(params) if params else "")
              return http(urllib.request.Request(url, headers={"Authorization": f"Bearer {tok}",
                                                               "X-EBAY-C-MARKETPLACE-ID": "EBAY_US"}))


          def active(tok):
              items, off = [], 0
              while True:
                  p = get(tok, "/buy/browse/v1/item_summary/search",
                          {"category_ids": CATEGORY, "filter": f"sellers:{{{SELLER}}}", "limit": 200, "offset": off})
                  b = p.get("itemSummaries", [])
                  items += b
                  off += len(b)
                  if not b or off >= p.get("total", 0) or off >= 10000:
                      return items


          def legacy(s):
              if s.get("legacyItemId"):
                  return str(s["legacyItemId"])
              m = re.match(r"v1\|(\d+)\|", s.get("itemId", ""))
              return m.group(1) if m else None


          def clean(u):
              return (u or "").split("?")[0] or None


          def rarity(v):
              if not v:
                  return None
              for r in RARITIES:
                  if v.strip().lower() == r.lower():
                      return r
              return ALIASES.get(v.strip().lower(), "Other")


          def condition(d):
              if (d.get("condition") or "").lower().startswith("graded"):
                  return "Graded"
              vals = " ".join(v.get("content", "") for x in d.get("conditionDescriptors", []) for v in x.get("values", [])).lower()
              for k, out in [("near mint", "Near Mint"), ("lightly", "Lightly Played"), ("excellent", "Lightly Played"),
                             ("moderately", "Moderately Played"), ("very good", "Moderately Played"),
                             ("heavily", "Heavily Played"), ("poor", "Heavily Played"), ("damaged", "Damaged")]:
                  if k in vals:
                      return out
              return None


          def descriptor(d, word):
              for x in d.get("conditionDescriptors", []):
                  if word in (x.get("name") or "").lower():
                      for v in x.get("values", []):
                          if v.get("content"):
                              return v["content"]
              return None


          def grading(d, a):
              g = a.get("professional grader") or descriptor(d, "grader") or ""
              grader = next((x for x in GRADERS if x.lower() in g.lower()), None)
              if grader == "Beckett":
                  grader = "BGS"
              grade = a.get("grade") or descriptor(d, "grade")
              if grade:
                  m = re.search(r"\d+(\.\d+)?", grade)
                  grade = m.group(0) if m else grade
              return grader, grade


          def from_ebay(s, d):
              lid = legacy(s)
              a = {x.get("name", "").lower(): x.get("value", "") for x in d.get("localizedAspects", [])}
              price = (d.get("price") or s.get("price") or {}).get("value")
              imgs = [i.get("imageUrl") for i in d.get("additionalImages", []) if i.get("imageUrl")]
              owned = {"ebayItemId": lid, "ebayUrl": f"https://www.ebay.com/itm/{lid}",
                       "listPrice": float(price) if price is not None else None,
                       "photoUrl": clean((d.get("image") or s.get("image") or {}).get("imageUrl"))}
              cond = condition(d)
              grader, grade = grading(d, a) if cond == "Graded" else (None, None)
              fill = {"name": a.get("card name") or a.get("character") or s.get("title"), "set": a.get("set"),
                      "number": a.get("card number"), "rarity": rarity(a.get("rarity")), "condition": cond,
                      "grader": grader, "grade": grade, "backPhotoUrl": clean(imgs[0]) if imgs else None,
                      "listedAt": s.get("itemCreationDate"), "listedDate": (s.get("itemCreationDate") or "")[:10] or None}
              return owned, fill


          def main():
              keys = {k: (os.environ.get(k) or "").strip() for k in ("EBAY_CLIENT_ID", "EBAY_CLIENT_SECRET")}
              # Easiest setup: one secret EBAY_KEYS holding the whole key note (both KEY=value lines).
              # A value pasted with its "EBAY_...=" prefix also works.
              blob = "\n".join([os.environ.get("EBAY_KEYS") or ""] + list(keys.values()))
              for line in blob.splitlines():
                  k, sep, v = line.strip().partition("=")
                  k = k.strip().removeprefix("export ").strip()
                  if sep and k in keys:
                      keys[k] = v.strip().strip('"').strip("'")
              cid, secret = keys["EBAY_CLIENT_ID"], keys["EBAY_CLIENT_SECRET"]
              if not cid or not secret:
                  seen = {n: ("set" if (os.environ.get(n) or "").strip() else "MISSING")
                          for n in ("EBAY_KEYS", "EBAY_CLIENT_ID", "EBAY_CLIENT_SECRET")}
                  sys.exit(f"eBay keys not found. Secrets seen by this run: {seen}. Add a repository secret named "
                           "EBAY_KEYS (Settings > Secrets and variables > Actions > Secrets tab > New repository secret) "
                           "and paste the whole ebay_keys note into it.")
              path = sys.argv[1] if len(sys.argv) > 1 else "cards.json"
              old = json.load(open(path))
              # Optional overrides.json next to cards.json: {"<ebay item id>": {"rarity": "Ultra Rare", "set": "..."}, ...}
              ov_path = os.path.join(os.path.dirname(os.path.abspath(path)), "overrides.json")
              overrides = {}
              if os.path.exists(ov_path):
                  raw = json.load(open(ov_path))
                  overrides = {str(k): {f: v for f, v in val.items() if v not in (None, "")}
                               for k, val in raw.items() if isinstance(val, dict) and not str(k).startswith("_")}
              by_id = {str(c.get("ebayItemId")): c for c in old.get("cards", []) if c.get("ebayItemId")}
              tok = token(cid, secret)
              listings = active(tok)
              if not listings and len(by_id) >= 3:
                  sys.exit(f"eBay returned 0 active listings but the shop has {len(by_id)}; not touching cards.json.")
              cards, added, skipped = [], [], []
              for s in listings:
                  lid = legacy(s)
                  if not lid:
                      continue
                  try:
                      d = get(tok, f"/buy/browse/v1/item/{urllib.parse.quote(s['itemId'], safe='')}")
                  except Exception as ex:
                      d = None
                      print(f"detail failed for {lid}: {ex}", file=sys.stderr)
                  prev = by_id.get(lid)
                  if d is None and prev is None:
                      skipped.append(lid)          # new listing without details: pick it up next run
                      continue
                  owned, fill = from_ebay(s, d or {})
                  if d is None:                    # keep the old price/photo rather than a partial value
                      owned = {k: prev.get(k) for k in owned} | {"listPrice": owned["listPrice"] or prev.get("listPrice")}
                  card = dict(prev or {})
                  for k in CURATED:
                      if fill.get(k) and (not card.get(k) or (k == "rarity" and card.get(k) == "Other" and fill[k] != "Other")):
                          card[k] = fill[k]
                  card.update({k: v for k, v in owned.items() if v not in (None, "")})
                  card.update(overrides.get(lid, {}))   # hand corrections in overrides.json always win
                  cards.append({k: v for k, v in card.items() if v not in (None, "")})
                  if prev is None:
                      added.append(card.get("name"))
              cards.sort(key=lambda c: c.get("listedAt") or "", reverse=True)
              for c in cards:                        # photo cropping was removed: drop its old data
                  for k in ("crop", "cropOf", "backCrop", "backCropOf"):
                      c.pop(k, None)
              removed = [c.get("name") for i, c in by_id.items() if i not in {x.get("ebayItemId") for x in cards}]
              if [json.dumps(c, sort_keys=True) for c in cards] == [json.dumps(c, sort_keys=True) for c in old.get("cards", [])]:
                  print(f"No change: {len(cards)} active listings.")
                  return
              out = {"updated": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"), "cards": cards}
              json.dump(out, open(path, "w"), separators=(",", ":"))
              print(f"{len(cards)} listed. Added {len(added)}: {added}. Removed {len(removed)}: {removed}. "
                    f"Skipped {len(skipped)} new listing(s) without details.")


          if __name__ == "__main__":
              main()
          PY
          python3 /tmp/ebay_shop_sync.py cards.json
      - name: Commit cards.json if it changed
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_KEYS: ${{ secrets.EBAY_KEYS }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add cards.json
          if git diff --cached --quiet; then echo "Shop already matches eBay."; exit 0; fi
          git commit -m "Sync shop data from eBay"
          # cards.json is one minified line, so a concurrent change always conflicts on rebase.
          # If the rebase/push fails, drop our commit, start from the latest main, re-run the sync and try again.
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            echo "Push attempt $i failed; re-syncing on top of latest main."
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            python3 /tmp/ebay_shop_sync.py cards.json || exit 1
            git add cards.json
            if git diff --cached --quiet; then echo "Shop already matches eBay."; exit 0; fi
            git commit -m "Sync shop data from eBay"
            sleep 5
          done
          git pull --rebase origin main && git push origin HEAD:main
