name: Fetch set symbols
# One-time (or on demand): copies the set symbol images into this repo so the shop page never depends on pokesymbols.com being online.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download symbols
        run: |
          mkdir -p symbols
          # fetch <local name> <candidate> [<candidate> ...]; a candidate is a pokesymbols.com name or a full URL
          fetch() { out=$1; shift; for c in "$@"; do case $c in http*) u=$c;; *) u="https://pokesymbols.com/images/tcg/sets/symbols/$c.png";; esac; curl -fsSL "$u" -o "symbols/$out.png" && { echo "OK $out <- $u"; return; }; done; rm -f "symbols/$out.png"; echo "FAILED $out"; }
          fetch 30th-celebration 30th-celebration
          fetch ascended-heroes ascended-heroes
          fetch chaos-rising chaos-rising
          fetch chilling-reign chilling-reign
          fetch journey-together journey-together
          fetch mega-evolution mega-evolution
          fetch paradox-rift paradox-rift
          fetch perfect-order perfect-order
          fetch phantasmal-flames phantasmal-flames
          fetch pitch-black pitch-black
          fetch pokemon-go pokemon-go
          fetch stellar-crown stellar-crown
          fetch surging-sparks surging-sparks
          fetch swsh-promo _promo
          fetch twilight-masquerade twilight-masquerade
          fetch xy-evolutions xy-evolutions
          fetch paldea-evolved paldea-evolved https://images.pokemontcg.io/sv2/symbol.png
          fetch prismatic-evolutions prismatic-evolutions https://images.pokemontcg.io/sv8pt5/symbol.png
          fetch shrouded-fable shrouded-fable https://images.pokemontcg.io/sv6pt5/symbol.png
          fetch trick-or-trade trick-or-trade trick-or-trade-2024 trick-or-trade-2023 trick-or-trade-2022 trick-or-trade-booster trick-or-trade-booster-bundle
          fetch 151 151 scarlet-violet-151 sv-151 https://images.pokemontcg.io/sv3pt5/symbol.png
          fetch battle-styles battle-styles https://images.pokemontcg.io/swsh5/symbol.png
          fetch brilliant-stars brilliant-stars https://images.pokemontcg.io/swsh9/symbol.png
          fetch celebrations celebrations https://images.pokemontcg.io/cel25/symbol.png
          fetch crown-zenith crown-zenith https://images.pokemontcg.io/swsh12pt5/symbol.png
          fetch destined-rivals destined-rivals https://images.pokemontcg.io/sv10/symbol.png
          fetch evolving-skies evolving-skies https://images.pokemontcg.io/swsh7/symbol.png
          fetch lost-origin lost-origin https://images.pokemontcg.io/swsh11/symbol.png
          fetch obsidian-flames obsidian-flames https://images.pokemontcg.io/sv3/symbol.png
          fetch scarlet-and-violet scarlet-and-violet scarlet-violet https://images.pokemontcg.io/sv1/symbol.png
          fetch silver-tempest silver-tempest https://images.pokemontcg.io/swsh12/symbol.png
          fetch vivid-voltage vivid-voltage https://images.pokemontcg.io/swsh4/symbol.png
          ls -la symbols
          mkdir -p rarities
          for r in special-illustration-rare illustration-rare mega-attack-rare ultra-rare ace-spec-rare double-rare rare uncommon common; do curl -fsSL "https://pokesymbols.com/images/tcg/rarities/$r.png" -o "rarities/$r.png" || echo "FAILED $r"; done
          # Radiant Rare: try the likely pokesymbols names; keep the existing (hand-made) icon if none exists
          for c in radiant-rare radiant rare-radiant; do curl -fsSL "https://pokesymbols.com/images/tcg/rarities/$c.png" -o /tmp/rr.png && [ -s /tmp/rr.png ] && { mv /tmp/rr.png rarities/radiant-rare.png; echo "OK radiant-rare <- $c"; break; }; done || true
          ls -la rarities
      - name: Shrink images
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image
          import glob
          for f in glob.glob('symbols/*.png')+glob.glob('rarities/*.png'):
              i=Image.open(f).convert('RGBA'); i.thumbnail((96,96)); i.save(f,optimize=True)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add symbols rarities
          git diff --cached --quiet || { git commit -m "Add set symbols"; git push; }
