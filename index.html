<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop Singles &amp; Slabs | ROD TCG</title>
<meta name="description" content="Pokémon singles and PSA slabs from ROD TCG. Search and filter by rarity, set and type. Every card links to its eBay listing.">
<style>
:root{--bg:#1B0F3A;--panel:#25174D;--line:#5A4A8B;--text:#FFF6E5;--muted:#D9D0F2;--cyan:#22D3EE;--pink:#FF4F9A;--hover:#3A2A6E}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 0;gap:12px;flex-wrap:wrap}
.top a{text-decoration:none;font-weight:800}
.top .back{color:var(--muted);font-weight:700}
h1{font-size:clamp(2rem,5vw,3.25rem);line-height:1.1;margin:.6em 0 .25em}
.sub{color:var(--muted);margin:0 0 1.25rem;max-width:46rem}
.bar{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 0;border-bottom:1px solid var(--line);display:grid;gap:10px;grid-template-columns:2fr 1fr 1fr 1fr 1fr}
.bar input,.bar select{width:100%;font:inherit;color:var(--text);background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:.55em 1em;min-width:0}
.bar select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text) 50%),linear-gradient(135deg,var(--text) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 14px) 55%;background-size:6px 6px;background-repeat:no-repeat;padding-right:2.2em}
.bar input:focus,.bar select:focus{outline:none;border-color:var(--cyan)}
.bar option{background:var(--panel);color:var(--text)}
.bar input::placeholder{color:var(--muted)}
.meta{display:flex;justify-content:space-between;align-items:center;margin:14px 0;color:var(--muted);gap:12px;flex-wrap:wrap}
.meta button{font:inherit;font-weight:800;color:var(--cyan);background:none;border:0;cursor:pointer;text-decoration:underline;padding:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;padding-bottom:40px}
.tile{display:flex;flex-direction:column;gap:8px}
.pic{position:relative;display:block;aspect-ratio:63/88;border-radius:12px;overflow:hidden;background:var(--panel)}
.pic.slab{aspect-ratio:63/88}
.pic img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;transition:opacity .25s}
.pic.slab img{object-fit:contain}
.pic .b{opacity:0}
.pic.hasback:hover .b,.pic.flip .b{opacity:1}
.pic.hasback:hover .f,.pic.flip .f{opacity:0}
.pills{display:flex;gap:6px;flex-wrap:wrap;font-size:.75rem;font-weight:800}
.pill{border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:.15em .7em}
.pill.c{background:var(--cyan);color:var(--bg);border-color:var(--cyan)}
.name{font-weight:800;text-decoration:none}
.name:hover{color:var(--cyan)}
.set{color:var(--muted);font-size:.875rem}
.price{font-weight:800}
.copies{font-size:.8125rem;font-weight:800;display:flex;flex-wrap:wrap;gap:6px}
.copies a{border:1px solid var(--cyan);border-radius:999px;padding:.1em .65em;text-decoration:none;white-space:nowrap}
.avail{color:var(--muted);font-size:.8125rem}
.empty{text-align:center;color:var(--muted);padding:60px 0;display:none}
.cta{text-align:center;padding:0 0 56px}
.cta a{display:inline-block;background:var(--pink);color:var(--bg);font-weight:800;border-radius:999px;padding:.7em 1.6em;text-decoration:none}
@media(max-width:820px){.bar{grid-template-columns:1fr 1fr}.bar #q{grid-column:1/-1}.grid{grid-template-columns:repeat(2,1fr);gap:14px}}
@media(prefers-reduced-motion:reduce){.pic img{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="https://rod-tcg.com/">ROD TCG</a><a class="back" href="https://rod-tcg.com/">&larr; Back to rod-tcg.com</a></div>
  <h1>Shop singles &amp; slabs</h1>
  <p class="sub">Every card links to its eBay listing, where you check out with eBay's buyer protection. Sealed product is coming soon.</p>

  <div class="bar" role="search">
    <input id="q" type="search" placeholder="Search name, set or number" aria-label="Search cards" autocomplete="off">
    <select id="rarity" aria-label="Rarity"></select>
    <select id="set" aria-label="Set"></select>
    <select id="type" aria-label="Type"></select>
    <select id="sort" aria-label="Sort">
      <option value="new">Newest</option>
      <option value="low">Price: low to high</option>
      <option value="high">Price: high to low</option>
      <option value="name">Name A–Z</option>
    </select>
  </div>

  <div class="meta"><span id="count">Loading…</span><button id="clear" hidden>Clear filters</button></div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty">No cards match those filters.</p>
  <p class="cta"><a href="https://www.ebay.com/usr/rodtcg">See every listing on eBay</a></p>
</div>

<script>
(function(){
  var RARITY_ORDER=["Special Illustration Rare","Illustration Rare","Mega Attack Rare","Ultra Rare","ACE SPEC Rare","Rare Holo V","Double Rare","Holo Rare","Rare","Uncommon","Common","Promo","Bulk lot","Other"];
  var LABEL={"Promo":"Black Star Promo"};
  var COND={"Near Mint":"NM","Lightly Played":"LP","Moderately Played":"MP","Heavily Played":"HP","Damaged":"DMG","Graded":"GRADED"};
  var $=function(id){return document.getElementById(id)};
  var q=$("q"),selR=$("rarity"),selS=$("set"),selT=$("type"),selSort=$("sort"),grid=$("grid");
  var groups=[];

  function lab(r){return LABEL[r]||r}
  function isSlab(c){return c.condition==="Graded"}
  function rarityOf(c){return isSlab(c)?(c.rarity||""):(c.rarity||"Other")}
  function typeOf(c){return isSlab(c)?(c.grader||"Graded"):"Raw"}
  function price(c){var n=parseFloat(c.listPrice);return isNaN(n)?Infinity:n}
  function money(c){var n=parseFloat(c.listPrice);return isNaN(n)?"See listing":"$"+n.toFixed(2)}
  function img(u){return (u||"").replace(/s-l\d+\./,"s-l500.")}
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]})}
  function key(c){return [c.name,c.number,c.set,c.condition,c.grade,c.rarity].map(function(x){return String(x||"").trim().toLowerCase()}).join("|")}

  function group(cards){
    var map={},order=[];
    cards.forEach(function(c){var k=key(c);if(!map[k]){map[k]=[];order.push(k)}map[k].push(c)});
    return order.map(function(k){return map[k]});
  }

  function fill(sel,first,vals){
    sel.innerHTML="";
    [["",first]].concat(vals.map(function(v){return [v[0],v[1]]})).forEach(function(o){
      var op=document.createElement("option");op.value=o[0];op.textContent=o[1];sel.appendChild(op);
    });
  }

  function build(cards){
    groups=group(cards);
    var rar={},sets={},types={};
    cards.forEach(function(c){var r=rarityOf(c);if(r)rar[r]=1;if(c.set)sets[c.set]=1;types[typeOf(c)]=1});
    var rs=RARITY_ORDER.filter(function(r){return rar[r]}).concat(Object.keys(rar).filter(function(r){return RARITY_ORDER.indexOf(r)<0}));
    fill(selR,"All rarities",rs.map(function(r){return [r,lab(r)]}));
    fill(selS,"All sets",Object.keys(sets).sort().map(function(s){return [s,s]}));
    var tv=[["raw","Raw cards"]];
    Object.keys(types).filter(function(t){return t!=="Raw"}).sort().forEach(function(t){tv.push(["slab:"+t,"Slabs – "+t])});
    if(tv.length>1)tv.splice(1,0,["slab","All slabs"]);
    fill(selT,"All types",tv);
  }

  function matches(g){
    var c=g[0],term=q.value.trim().toLowerCase();
    if(selR.value&&rarityOf(c)!==selR.value)return false;
    if(selS.value&&c.set!==selS.value)return false;
    var t=selT.value;
    if(t==="raw"&&isSlab(c))return false;
    if(t==="slab"&&!isSlab(c))return false;
    if(t.indexOf("slab:")===0&&!(isSlab(c)&&(c.grader||"Graded")===t.slice(5)))return false;
    if(term){
      var hay=[c.name,c.set,c.number,lab(rarityOf(c)),isSlab(c)?(c.grader+" "+c.grade+" slab graded"):"raw"].join(" ").toLowerCase();
      return term.split(/\s+/).every(function(w){return hay.indexOf(w)>=0});
    }
    return true;
  }

  function tile(g){
    var c=g[0],slab=isSlab(c),best=g.slice().sort(function(a,b){return price(a)-price(b)})[0];
    var cond=slab?[c.grader,c.grade].filter(Boolean).join(" ")||"Graded":(COND[c.condition]||c.condition||"");
    var rar=rarityOf(c);
    var pills='<span class="pill c">'+esc(cond)+'</span>'+(rar?'<span class="pill">'+esc(lab(rar))+'</span>':'');
    var hasBack=!!c.backPhotoUrl;
    var pic=c.photoUrl?'<img class="f" loading="lazy" src="'+esc(img(c.photoUrl))+'" alt="'+esc(c.name+" "+(c.number||"")+" front")+'">'+(hasBack?'<img class="b" loading="lazy" src="'+esc(img(c.backPhotoUrl))+'" alt="'+esc(c.name+" "+(c.number||"")+" back")+'">':''):'';
    var meta=[c.set,c.number].filter(Boolean).join(" · ");
    var bottom;
    if(g.length>1){
      bottom='<div class="avail">'+g.length+' available</div><div class="copies">'+g.map(function(x,i){return '<a href="'+esc(x.ebayUrl)+'" target="_blank" rel="noopener">Listing '+(i+1)+' · '+money(x)+'</a>'}).join("")+'</div>';
    }else bottom='<a class="price" href="'+esc(c.ebayUrl)+'" target="_blank" rel="noopener">'+money(c)+'</a>';
    return '<div class="tile"><a class="pic'+(slab?' slab':'')+(hasBack?' hasback':'')+'" href="'+esc(best.ebayUrl)+'" target="_blank" rel="noopener" aria-label="'+esc(c.name)+' on eBay">'+pic+'</a>'
      +'<div class="pills">'+pills+'</div><a class="name" href="'+esc(best.ebayUrl)+'" target="_blank" rel="noopener">'+esc(c.name)+'</a><div class="set">'+esc(meta)+'</div>'+bottom+'</div>';
  }

  function render(){
    var list=groups.filter(matches),s=selSort.value;
    if(s==="low")list.sort(function(a,b){return price(a[0])-price(b[0])});
    else if(s==="high")list.sort(function(a,b){return price(b[0])-price(a[0])});
    else if(s==="name")list.sort(function(a,b){return a[0].name.localeCompare(b[0].name)});
    else list.sort(function(a,b){return (b[0].listedAt||"").localeCompare(a[0].listedAt||"")});
    grid.innerHTML=list.map(tile).join("");
    var n=list.reduce(function(a,g){return a+g.length},0);
    $("count").textContent=list.length+" card"+(list.length===1?"":"s")+(n!==list.length?" ("+n+" listings)":"");
    $("empty").style.display=list.length?"none":"block";
    var active=q.value||selR.value||selS.value||selT.value;
    $("clear").hidden=!active;
    var p=new URLSearchParams();
    if(q.value)p.set("q",q.value);if(selR.value)p.set("rarity",selR.value);if(selS.value)p.set("set",selS.value);if(selT.value)p.set("type",selT.value);if(s!=="new")p.set("sort",s);
    var qs=p.toString();try{history.replaceState(null,"",qs?"?"+qs:location.pathname)}catch(e){}
  }

  function fromUrl(){
    var p=new URLSearchParams(location.search);
    q.value=p.get("q")||"";
    [["rarity",selR],["set",selS],["type",selT],["sort",selSort]].forEach(function(x){
      var v=p.get(x[0]);if(v){x[1].value=v;if(x[1].value!==v)x[1].value=x[0]==="sort"?"new":""}
    });
  }

  [q,selR,selS,selT,selSort].forEach(function(el){el.addEventListener(el===q?"input":"change",function(){render();if(el.tagName==="SELECT")el.blur()})});
  $("clear").addEventListener("click",function(){q.value="";selR.value="";selS.value="";selT.value="";render()});
  grid.addEventListener("click",function(e){var p=e.target.closest(".pic.hasback");if(p&&matchMedia("(hover:none)").matches&&!p.classList.contains("flip")){e.preventDefault();p.classList.add("flip")}});

  fetch("cards.json?v="+Date.now()).then(function(r){return r.json()}).then(function(d){
    build(d.cards||[]);fromUrl();render();
  }).catch(function(){$("count").textContent="Couldn't load the card list. Please refresh, or see every listing on eBay.";});
})();
</script>
</body>
</html>
